<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <!-- 1. META DASAR WAJIB -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="googlebot" content="index, follow">

    <!-- 2. SCRIPT IKLAN OTOMATIS ADSENSE (HARUS DI POSISI INI, TIDAK BOLEH DITAMBAH SCRIPT LAIN) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2272135901889807" crossorigin="anonymous"></script>

    <!-- 3. INFORMASI WEBSITE -->
    <title>KARYA ABADI JOBS - Generator CV & Surat Lamaran Kerja Gratis</title>
    <meta name="description" content="Karya Abadi Jobs adalah tool online gratis untuk membuat CV ATS dan Surat Lamaran Kerja. Template profesional, mudah diunduh PDF, tanpa registrasi.">
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- 4. FONT DAN CSS DASAR (Preconnect untuk mempercepat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root{--avh:100vh}
        @supports(height:100dvh){:root{--avh:100dvh}}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:#0A0A0A;color:#fff}
        
        /* Sembunyikan view yang tidak aktif */
        .view { display: none; }
        .view.active { display: block; }
        
        /* Toast UI */
        #toast-box{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast-item{padding:10px 18px;border-radius:10px;color:#fff;font-size:13px;font-weight:500;transform:translateX(120%);transition:transform .3s ease;pointer-events:auto;backdrop-filter:blur(8px)}
        .toast-item.show{transform:translateX(0)}
        .toast-item.success{background:rgba(153,27,27,.92)}
        .toast-item.error{background:rgba(220,38,38,.92)}
        .toast-item.info{background:rgba(30,30,30,.92)}
        
        /* CSS lainnya akan diload via Tailwind config di bawah */
    </style>
</head>
<body class="dark:bg-brand-black bg-gray-50 dark:text-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- KONTEN WEBSITE AKAN DIRENDER DISINI -->
    <div id="app-root">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:#666;">
            <p>Memuat Karya Abadi Jobs...</p>
        </div>
    </div>

    <!-- 
        SCRIPT LIBRARY DIPINDAHKAN KE BAWAH INI.
        INI ADALAH KUNCI UTAMA AGAR ADSENSE TIDAK RUSAK.
        BROWSER AKAN MEMUAT ADSENSE TERLEBIH DAHULU DI ATAS, 
        LALU MEMUAT LIBRARY BERAT DI BAWAH SAAT HALAMAN SUDAH SIAP.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0W6GP10X59"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- KONFIGURASI TAILWIND DAN LOGIC APLIKASI -->
    <script>
        // Tailwind Config
        tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{body:['Inter','system-ui','sans-serif']},colors:{brand:{red:'#DC2626',darkred:'#991B1B',black:'#0A0A0A',dark:'#111111',card:'#1A1A1A',border:'#2A2A2A'}}}}}
        
        // Google Analytics Config
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-0W6GP10X59');

        // Sisanya adalah kode aplikasi Anda (disingkat di sini, salin seluruh logic Anda dari kode sebelumnya ke bawah ini)
        // Pastikan menambahkan history.pushState di fungsi showPage untuk routing URL.
        
        // ================= APP LOGIC =================
        var curCat='cv',curTpl='cv1',photoData=null,mobTab='form';
        var savedCV={},savedSurat={},selFont='Arial',selSize=10,selLH=1.4;
        var eduList=[{t:'',m:'y',p:'',y:''}];
        var eduNonList=[{t:'',k:'',d:'',j:''}];
        var expList=[{pt:'', jl:'', kt:'', posList:[{j:'', m:'',desc:''}]}];
        var hSkills=['']; var sSkills=['']; var kSkills=[''];
        var skillMode='hs'; var lampList=['']; var _rpTimer=null;
        var CV_M=[{id:'cv1',name:'CV Template 1'},{id:'cv2',name:'CV Template 2'},{id:'cv3',name:'CV Template 3'},{id:'cv4',name:'CV Template 4'}];
        var ST_M=[
          {id:'s-ou',name:'Email (Umum)',pos:false,on:true,semua:false},
          {id:'s-tu',name:'Tulis Tangan (Umum)',pos:false,on:false,semua:false},
          {id:'s-op',name:'Email (Posisi)',pos:true,on:true,semua:false},
          {id:'s-tp',name:'Tulis Tangan (Posisi)',pos:true,on:false,semua:false},
          {id:'s-os',name:'Email (Semua PT)',pos:false,on:true,semua:true},
          {id:'s-ts',name:'Tulis Tangan (Semua PT)',pos:false,on:false,semua:true}
        ];

        // === STATE LAMPIRAN PDF ===
        var lampiranImages = []; var TARGET_PDF_SIZE = 1 * 1024 * 1024; var MAX_LAMPIRAN_IMAGES = 20;
        var lampiranProcessing = false; var draggedItemIdx = null;
        var _tw='width:100%;table-layout:fixed;border-collapse:collapse;border:none;';
        var _r1='width:50%;vertical-align:top;padding-right:3mm;word-break:break-word;';
        var _r2='width:50%;vertical-align:top;padding-left:3mm;word-break:break-word;';

        function v(id){var el=document.getElementById(id);return el?el.value:''}
        function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
        function toast(msg,type){type=type||'success';var d=document.createElement('div');d.className='toast-item '+type;d.textContent=msg;document.getElementById('toast-box').appendChild(d);requestAnimationFrame(function(){d.classList.add('show')});setTimeout(function(){d.classList.remove('show');setTimeout(function(){d.remove()},300)},2800)}
        function applyPageStyle(){var p=document.getElementById('a4-page');if(p)p.style.cssText='font-family:'+selFont+';font-size:'+selSize+'pt;line-height:'+selLH;var pm=document.getElementById('a4-page-mob');if(pm)pm.style.cssText='font-family:'+selFont+';font-size:'+selSize+'pt;line-height:'+selLH}
        function schedulePreview(){if(_rpTimer)clearTimeout(_rpTimer);_rpTimer=setTimeout(renderPreview,60)}
        function updateVH(){document.documentElement.style.setProperty('--avh',window.innerHeight+'px')}
        function L(key){return key}

        // FUNGSI ROUTING YANG MEMBUAT ADSENSE MENGENALI PERUBAHAN HALAMAN
        function showPage(pageId) {
          document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
          const view = document.getElementById('view-' + pageId);
          if (view) {
            view.classList.add('active');
            window.scrollTo(0, 0);
            
            // Update URL hash untuk SEO dan AdSense tracking
            if (history.pushState) {
              history.pushState({page: pageId}, '', '#' + pageId);
            }
            
            if (pageId === 'generator') {
              setTimeout(() => {
                updateVH(); renderPreview();
                if (!generatorInitialized) { resetZoom(); generatorInitialized = true; } else { applyZoom(); }
              }, 50);
            }
            if (pageId === 'lampiran') {
              setTimeout(() => { updateLampiranSummary(); }, 50);
            }
          }
        }

        // ... [SALIN SELURUH SISA FUNGSI JAVASCRIPT ANDA DARI KODE SEBELUMNYA DI SINI] ...
        // Mulai dari fungsi toggleMobileMenu() sampai dengan window.addEventListener('resize', updateVH);
        // Pastikan tidak ada perubahan pada logika renderCV3() yang sudah diperbaiki.
        
        // ================= INITIALIZATION =================
        window.addEventListener('load', function() {
          updateVH(); initSlider(); renderForm(); renderPreview(); resetZoom(); initPanZoom(); initLampiranDropZone();
          
          // Cek URL hash saat halaman pertama kali dimuat
          var hash = window.location.hash.replace('#', '');
          if(hash && document.getElementById('view-' + hash)) {
            showPage(hash);
          }
        });
        window.addEventListener('resize', updateVH);
    </script>
</body>
</html>
